<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drink Water Reminder</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/48/water--v1.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        app: {
                            base:      '#0f172a',
                            dark:      '#020617',
                            card:      'rgba(30, 41, 59, 0.7)',
                            gold:      '#fbbf24',
                            goldGlow:  '#f59e0b',
                            accent:    '#3b82f6',
                            text:      '#f1f5f9'
                        }
                    },
                    fontFamily: {
                        'sans':   ['"Inter"', 'sans-serif'],
                        'nunito': ['"Nunito"', 'sans-serif']
                    },
                    animation: {
                        'fade-in':   'fadeIn 0.6s ease-out',
                        'glow':      'glow 2s ease-in-out infinite alternate',
                        'bounce-drop': 'bounceDrop 1.5s ease-in-out infinite'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%':   { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        glow: {
                            '0%':   { boxShadow: '0 0 5px #3b82f6' },
                            '100%': { boxShadow: '0 0 20px #3b82f6, 0 0 10px #3b82f6' }
                        },
                        bounceDrop: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%':      { transform: 'translateY(-8px)' }
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { background-color: #020617; }
        body {
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #020617 70%);
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .hidden-section { display: none !important; }
        .fade-in { animation: fadeIn 0.6s ease-out; }
        .tap-area {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            user-select: none;
        }
        .tap-area:active { transform: scale(0.99); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .blue-gradient { background: linear-gradient(to right, #3b82f6, #60a5fa); }
        .emerald-gradient { background: linear-gradient(135deg, #10b981, #059669); }

        .input-field {
            background-color: rgba(30, 41, 59, 0.8);
            border: 1px solid #475569;
            color: #f1f5f9;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
            width: 100%;
        }
        .input-field:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .label {
            font-size: 11px;
            font-weight: 600;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            display: block;
            margin-bottom: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white; padding: 12px 22px; border-radius: 11px;
            font-weight: 600; border: none; cursor: pointer;
            transition: all 0.3s;
            display: inline-flex; align-items: center; gap: 8px; justify-content: center;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(59, 130, 246, 0.3);
        }
        .btn-primary:active { transform: translateY(0); }
        .btn-secondary {
            background-color: #1e293b; color: #f1f5f9;
            padding: 10px 18px; border-radius: 10px;
            font-weight: 500; border: 1px solid #475569;
            cursor: pointer; transition: all 0.3s;
        }
        .btn-secondary:hover {
            background-color: #334155; border-color: #64748b;
        }
        .btn-gold {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white; padding: 11px 20px; border-radius: 10px;
            font-weight: 700; border: none; cursor: pointer;
            transition: all 0.3s;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(59, 130, 246, 0.3);
        }

        .container-card { width: 100%; max-width: 600px; margin: 0 auto; }

        .water-icon {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3);
            animation: bounceDrop 1.5s ease-in-out infinite;
        }

        .water-glass {
            width: 48px; height: 56px;
            background: rgba(59, 130, 246, 0.15);
            border: 2px solid rgba(59, 130, 246, 0.4);
            border-radius: 6px 6px 4px 4px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
            display: flex; align-items: flex-end;
            overflow: hidden;
        }
        .water-glass:hover {
            border-color: #3b82f6;
            transform: scale(1.05);
        }
        .water-glass .fill {
            background: linear-gradient(180deg, #3b82f6, #2563eb);
            width: 100%;
            border-radius: 0 0 3px 3px;
            transition: height 0.5s ease;
        }
        .water-glass .glass-label {
            position: absolute;
            bottom: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: #94a3b8;
            white-space: nowrap;
        }
        .water-glass.full { border-color: #3b82f6; }

        .progress-ring {
            width: 140px; height: 140px;
            border-radius: 50%;
            background: conic-gradient(#3b82f6 var(--progress, 0%), rgba(30, 41, 59, 0.6) 0%);
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .progress-ring-inner {
            width: 110px; height: 110px;
            border-radius: 50%;
            background: #0f172a;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .log-entry {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 9px;
            margin-bottom: 6px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 13px;
        }

        .notification-bar {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(16, 185, 129, 0.1));
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 14px;
            border-radius: 11px;
            text-align: center;
        }

        @media (max-width: 640px) {
            .glasses-grid { grid-template-columns: repeat(4, 1fr) !important; }
        }
    </style>
</head>
<body>
    <!-- LOGIN VIEW -->
    <div id="loginView" class="container-card glass-panel p-8 rounded-2xl fade-in" style="max-width: 400px;">
        <div class="flex justify-center mb-6">
            <div class="w-16 h-16 rounded-full border-2 border-app-accent flex items-center justify-center">
                <svg class="w-8 h-8 text-app-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
        </div>
        <h2 class="text-3xl font-bold text-center mb-2 text-blue-400">💧 Drink Water</h2>
        <p class="text-slate-500 uppercase tracking-widest text-center text-xs mb-8">Stay hydrated · Stay healthy</p>

        <div class="space-y-4 mb-6">
            <div>
                <label class="label">Username</label>
                <input type="text" id="usernameInput" placeholder="username" class="input-field">
            </div>
            <div>
                <label class="label">Password</label>
                <input type="password" id="passwordInput" placeholder="password" class="input-field">
            </div>
        </div>
        <p id="loginError" class="hidden text-red-400 text-sm mb-4 text-center"></p>
        <button onclick="attemptLogin()" class="w-full btn-primary">
            <span>Start Hydrating</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
            </svg>
        </button>
    </div>

    <!-- APP CONTAINER -->
    <div id="appContainer" class="hidden-section container-card">
        <div class="glass-panel p-6 rounded-2xl space-y-6 fade-in">
            <!-- Header -->
            <div class="flex items-center gap-4 mb-2">
                <div class="water-icon">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 2C12 2 7 8 7 13c0 2.76 2.24 5 5 5s5-2.24 5-5c0-5-5-11-5-11z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-blue-400" style="font-family: 'Nunito', sans-serif;">Hydration Tracker</h1>
                    <p class="text-slate-400 text-sm" id="greetingMsg">Welcome! Time to drink water.</p>
                </div>
            </div>

            <!-- Progress Ring -->
            <div class="flex justify-center">
                <div class="progress-ring" id="progressRing">
                    <div class="progress-ring-inner">
                        <span class="text-3xl font-bold text-blue-400" id="progressPercent">0%</span>
                        <span class="text-xs text-slate-500">daily goal</span>
                    </div>
                </div>
            </div>

            <div class="text-center">
                <span class="text-lg font-semibold" id="intakeDisplay">0</span>
                <span class="text-slate-400"> / 8 glasses</span>
            </div>

            <!-- Quick Add Glasses -->
            <div>
                <label class="label text-center mb-3">Quick Add Water</label>
                <div class="grid grid-cols-4 gap-3 glasses-grid" style="display: grid;">
                    <div class="water-glass" onclick="drinkWater(1)">
                        <div class="fill" style="height: 25%;"></div>
                        <span class="glass-label">1</span>
                    </div>
                    <div class="water-glass" onclick="drinkWater(2)">
                        <div class="fill" style="height: 50%;"></div>
                        <span class="glass-label">2</span>
                    </div>
                    <div class="water-glass" onclick="drinkWater(3)">
                        <div class="fill" style="height: 75%;"></div>
                        <span class="glass-label">3</span>
                    </div>
                    <div class="water-glass" onclick="drinkWater(4)">
                        <div class="fill" style="height: 100%;"></div>
                        <span class="glass-label">4</span>
                    </div>
                </div>
            </div>

            <!-- Custom Amount -->
            <div class="flex gap-3 items-end">
                <div class="flex-1">
                    <label class="label">Custom Glasses</label>
                    <input type="number" id="customAmount" class="input-field" min="1" max="20" value="1">
                </div>
                <button onclick="drinkWater(parseInt(document.getElementById('customAmount').value) || 1)" class="btn-primary" style="padding: 11px 18px;">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                    </svg>
                    Add
                </button>
                <button onclick="resetIntake()" class="btn-secondary" style="padding: 11px 14px;">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                </button>
            </div>

            <!-- Notification Bar -->
            <div id="notificationBar" class="notification-bar hidden">
                <p class="text-sm font-semibold" id="notificationText">💧 Time to drink water!</p>
            </div>

            <!-- Reminder Settings -->
            <div class="section-divider" style="height:1px;background:rgba(255,255,255,0.08);margin:16px 0;"></div>
            <div>
                <label class="label">Reminder Interval</label>
                <div class="flex gap-3">
                    <select id="reminderInterval" class="input-field">
                        <option value="15">Every 15 minutes</option>
                        <option value="30" selected>Every 30 minutes</option>
                        <option value="45">Every 45 minutes</option>
                        <option value="60">Every 60 minutes</option>
                    </select>
                    <button onclick="toggleReminder()" class="btn-gold" id="reminderBtn">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                        </svg>
                        <span>Start</span>
                    </button>
                </div>
            </div>

            <!-- Today's Log -->
            <div>
                <div class="flex justify-between items-center mb-3">
                    <label class="label mb-0">Today's Log</label>
                    <button onclick="clearLog()" class="text-xs text-slate-500 hover:text-red-400 transition">Clear</button>
                </div>
                <div id="logContainer">
                    <p class="text-slate-500 text-sm text-center py-4">No water logged yet today. Drink up!</p>
                </div>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-3 gap-3" style="display: grid;">
                <div class="stat-card text-center p-3" style="background:rgba(30,41,59,0.5);border-radius:10px;">
                    <div class="text-xl font-bold text-blue-400" id="totalGlasses">0</div>
                    <div class="text-xs text-slate-500 uppercase tracking-wide">Glasses</div>
                </div>
                <div class="stat-card text-center p-3" style="background:rgba(30,41,59,0.5);border-radius:10px;">
                    <div class="text-xl font-bold text-emerald-400" id="streakCount">0</div>
                    <div class="text-xs text-slate-500 uppercase tracking-wide">Day Streak</div>
                </div>
                <div class="stat-card text-center p-3" style="background:rgba(30,41,59,0.5);border-radius:10px;">
                    <div class="text-xl font-bold text-yellow-400" id="weeklyAvg">0</div>
                    <div class="text-xs text-slate-500 uppercase tracking-wide">Avg/Day</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // AUTH
        // ============================================================
        function attemptLogin() {
            const u = document.getElementById('usernameInput').value;
            const p = document.getElementById('passwordInput').value;
            const err = document.getElementById('loginError');
            if (u === 'ahmad' && p === 'ahmadwin') {
                document.getElementById('loginView').classList.add('hidden-section');
                document.getElementById('appContainer').classList.remove('hidden-section');
                document.getElementById('appContainer').classList.add('fade-in');
                initApp();
            } else {
                err.classList.remove('hidden');
                err.textContent = 'Invalid credentials.';
                setTimeout(() => err.classList.add('hidden'), 2500);
            }
        }

        // ============================================================
        // APP STATE
        // ============================================================
        const GOAL = 8;
        let intake = 0;
        let log = [];
        let reminderInterval = null;
        let reminderActive = false;
        let streak = 0;
        let history = {};

        function initApp() {
            loadState();
            updateUI();
            updateGreeting();
            checkStreak();
            startPeriodicNotifications();
        }

        function loadState() {
            try {
                const saved = localStorage.getItem('drinkwater_log');
                if (saved) {
                    const data = JSON.parse(saved);
                    log = data.log || [];
                    intake = data.intake || 0;
                    streak = data.streak || 0;
                    history = data.history || {};
                }
            } catch(e) {}
        }

        function saveState() {
            try {
                localStorage.setItem('drinkwater_log', JSON.stringify({
                    log, intake, streak, history
                }));
            } catch(e) {}
        }

        function drinkWater(amount) {
            if (amount <= 0) return;
            intake += amount;
            if (intake > 50) intake = 50;
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            log.push({ time: timeStr, amount, ts: now.getTime() });
            saveState();
            updateUI();
            showNotification(amount > 1 ? `💧 Drank ${amount} glasses!` : `💧 Drank 1 glass!`);
            checkGoalReached();
        }

        function resetIntake() {
            if (intake === 0) return;
            intake = 0;
            log = [];
            saveState();
            updateUI();
            showNotification('🔄 Intake reset for today');
        }

        function updateUI() {
            const pct = Math.min(100, Math.round((intake / GOAL) * 100));
            document.getElementById('progressPercent').textContent = pct + '%';
            document.getElementById('progressRing').style.setProperty('--progress', pct + '%');
            document.getElementById('intakeDisplay').textContent = intake;
            document.getElementById('totalGlasses').textContent = intake;

            const container = document.getElementById('logContainer');
            if (log.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-sm text-center py-4">No water logged yet today. Drink up!</p>';
            } else {
                const recent = [...log].reverse().slice(0, 20);
                container.innerHTML = recent.map(e =>
                    `<div class="log-entry">
                        <span class="flex items-center gap-2">
                            <span class="text-blue-400">💧</span>
                            <span>${e.amount} glass${e.amount > 1 ? 'es' : ''}</span>
                        </span>
                        <span class="text-slate-500 text-xs">${e.time}</span>
                    </div>`
                ).join('');
            }

            document.getElementById('weeklyAvg').textContent = calcWeeklyAvg();
        }

        function updateGreeting() {
            const h = new Date().getHours();
            let msg = 'Stay hydrated!';
            if (h < 12) msg = 'Good morning! Start your day with water.';
            else if (h < 17) msg = 'Good afternoon! Keep drinking water.';
            else msg = 'Good evening! Don\'t forget to hydrate.';
            document.getElementById('greetingMsg').textContent = msg;
        }

        function checkGoalReached() {
            if (intake >= GOAL) {
                showNotification('🎉 Goal reached! You drank 8 glasses today!');
                updateStreak();
            }
        }

        function updateStreak() {
            const today = new Date().toDateString();
            if (!history[today]) {
                history[today] = intake;
                streak++;
                saveState();
                document.getElementById('streakCount').textContent = streak;
            }
        }

        function checkStreak() {
            const yesterday = new Date(Date.now() - 86400000).toDateString();
            const today = new Date().toDateString();
            if (!history[yesterday] && !history[today]) {
                streak = 0;
                saveState();
            }
            document.getElementById('streakCount').textContent = streak;
        }

        function calcWeeklyAvg() {
            let total = 0, days = 0;
            for (let i = 0; i < 7; i++) {
                const d = new Date(Date.now() - i * 86400000).toDateString();
                if (history[d]) { total += history[d]; days++; }
            }
            return days > 0 ? (total / days).toFixed(1) : '0';
        }

        // ============================================================
        // NOTIFICATIONS
        // ============================================================
        function showNotification(msg) {
            const bar = document.getElementById('notificationBar');
            const text = document.getElementById('notificationText');
            text.textContent = msg;
            bar.classList.remove('hidden');
            clearTimeout(bar._timeout);
            bar._timeout = setTimeout(() => bar.classList.add('hidden'), 4000);
        }

        function startPeriodicNotifications() {
            let count = 0;
            setInterval(() => {
                if (intake < GOAL) {
                    const msgs = [
                        '💧 Time to drink water!',
                        '💧 Your body needs water!',
                        '💧 Hydration reminder!',
                        '💧 Drink up! Keep going!',
                        '💧 Water = energy. Take a sip!'
                    ];
                    showNotification(msgs[count % msgs.length]);
                    count++;
                }
            }, 60000);
        }

        // ============================================================
        // REMINDER TIMER
        // ============================================================
        function toggleReminder() {
            const btn = document.getElementById('reminderBtn');
            const interval = parseInt(document.getElementById('reminderInterval').value) * 60000;
            if (reminderActive) {
                clearInterval(reminderInterval);
                reminderActive = false;
                btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg><span>Start</span>`;
            } else {
                reminderInterval = setInterval(() => {
                    showNotification('🔔 Reminder: Time to drink water!');
                }, interval);
                reminderActive = true;
                btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg><span>Stop</span>`;
            }
        }

        function clearLog() {
            log = [];
            saveState();
            updateUI();
            showNotification('🗑️ Log cleared');
        }

        // Periodic greeting update
        setInterval(updateGreeting, 60000);
    </script>
</body>
</html>
