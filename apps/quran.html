<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Memorizer</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/48/islam.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        app: {
                            base:      '#0f172a',
                            dark:      '#020617',
                            card:      'rgba(30, 41, 59, 0.7)',
                            gold:      '#fbbf24',
                            goldGlow:  '#f59e0b',
                            accent:    '#10b981',
                            text:      '#f1f5f9'
                        }
                    },
                    fontFamily: {
                        'sans':   ['"Inter"', 'sans-serif'],
                        'nunito': ['"Nunito"', 'sans-serif']
                    },
                    animation: {
                        'fade-in':   'fadeIn 0.6s ease-out',
                        'glow':      'glow 2s ease-in-out infinite alternate'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%':   { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        glow: {
                            '0%':   { boxShadow: '0 0 5px #10b981' },
                            '100%': { boxShadow: '0 0 20px #10b981, 0 0 10px #10b981' }
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { background-color: #020617; }
        body {
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #020617 70%);
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .hidden-section { display: none !important; }
        .fade-in { animation: fadeIn 0.6s ease-out; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .input-field {
            background-color: rgba(30, 41, 59, 0.8);
            border: 1px solid #475569;
            color: #f1f5f9;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
            width: 100%;
        }
        .input-field:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }
        .label {
            font-size: 11px;
            font-weight: 600;
            color: #10b981;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            display: block;
            margin-bottom: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white; padding: 12px 22px; border-radius: 11px;
            font-weight: 600; border: none; cursor: pointer;
            transition: all 0.3s;
            display: inline-flex; align-items: center; gap: 8px; justify-content: center;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(16, 185, 129, 0.3);
        }
        .btn-primary:active { transform: translateY(0); }
        .btn-secondary {
            background-color: #1e293b; color: #f1f5f9;
            padding: 10px 18px; border-radius: 10px;
            font-weight: 500; border: 1px solid #475569;
            cursor: pointer; transition: all 0.3s;
        }
        .btn-secondary:hover {
            background-color: #334155; border-color: #64748b;
        }
        .btn-gold {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #020617; padding: 11px 20px; border-radius: 10px;
            font-weight: 700; border: none; cursor: pointer;
            transition: all 0.3s;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(251, 191, 36, 0.3);
        }

        .container-card { width: 100%; max-width: 880px; margin: 0 auto; }

        .notification-bar {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(251, 191, 36, 0.1));
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 14px;
            border-radius: 11px;
            text-align: center;
        }

        .ayah-text {
            font-size: 28px;
            line-height: 2;
            direction: rtl;
            font-family: 'Traditional Arabic', 'Scheherazade New', 'Amiri', serif;
            color: #f1f5f9;
        }
        .ayah-text .ayah-word {
            transition: all 0.3s;
        }
        .ayah-text .ayah-word.hidden {
            color: transparent;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 4px;
            user-select: none;
        }
        .ayah-text .ayah-word.hidden:hover {
            background: rgba(16, 185, 129, 0.3);
        }
        .ayah-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            font-size: 12px;
            color: #10b981;
            margin: 0 4px;
            flex-shrink: 0;
        }
        .ayah-block {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.2s;
        }
        .ayah-block:hover {
            background: rgba(16, 185, 129, 0.05);
        }
        .ayah-block.memorized {
            border-left: 3px solid #10b981;
        }
        .ayah-block.bookmarked {
            background: rgba(251, 191, 36, 0.06);
        }

        .surah-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .surah-card:hover {
            background: rgba(30, 41, 59, 0.8);
            border-color: #10b981;
            transform: translateY(-2px);
        }
        .surah-number {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: #10b981;
            flex-shrink: 0;
        }
        .surah-name-ar {
            font-size: 20px;
            font-family: 'Traditional Arabic', 'Scheherazade New', 'Amiri', serif;
            direction: rtl;
        }

        .tab-btn {
            padding: 10px 16px; border-radius: 9px;
            font-size: 13px; font-weight: 600;
            background-color: rgba(30, 41, 59, 0.4);
            color: #cbd5e1; border: 1px solid transparent;
            cursor: pointer; transition: all 0.3s;
            white-space: nowrap;
        }
        .tab-btn:hover { background-color: rgba(30, 41, 59, 0.7); }
        .tab-btn.active {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(251, 191, 36, 0.1));
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.3);
        }
        .tab-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
            scrollbar-width: thin;
        }

        .progress-bar {
            height: 6px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #34d399);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.6);
            padding: 14px;
            border-radius: 11px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-value {
            font-size: 24px;
            font-weight: 800;
            color: #10b981;
            margin-bottom: 4px;
            font-family: 'Nunito', sans-serif;
        }
        .stat-label {
            font-size: 11px;
            color: #cbd5e1;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        @media (max-width: 640px) {
            .ayah-text { font-size: 22px; }
            .surahs-grid { grid-template-columns: 1fr !important; }
        }
    </style>
</head>
<body>
    <!-- LOGIN VIEW -->
    <div id="loginView" class="container-card glass-panel p-8 rounded-2xl fade-in" style="max-width: 400px;">
        <div class="flex justify-center mb-6">
            <div class="w-16 h-16 rounded-full border-2 border-app-accent flex items-center justify-center">
                <svg class="w-8 h-8 text-app-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
        </div>
        <h2 class="text-3xl font-bold text-center mb-2 text-emerald-400">📖 Quran Memorizer</h2>
        <p class="text-slate-500 uppercase tracking-widest text-center text-xs mb-8">Read · Memorize · Reflect</p>

        <div class="space-y-4 mb-6">
            <div>
                <label class="label">Username</label>
                <input type="text" id="usernameInput" placeholder="username" class="input-field">
            </div>
            <div>
                <label class="label">Password</label>
                <input type="password" id="passwordInput" placeholder="password" class="input-field">
            </div>
        </div>
        <p id="loginError" class="hidden text-red-400 text-sm mb-4 text-center"></p>
        <button onclick="attemptLogin()" class="w-full btn-primary">
            <span>Enter Quran</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
            </svg>
        </button>
    </div>

    <!-- APP CONTAINER -->
    <div id="appContainer" class="hidden-section container-card">
        <div class="glass-panel p-6 rounded-2xl fade-in">
            <!-- Header -->
            <div class="flex items-center gap-4 mb-4">
                <div class="w-14 h-14 rounded-2xl bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center">
                    <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-emerald-400" style="font-family: 'Nunito', sans-serif;" id="mainTitle">Quran Memorizer</h1>
                    <p class="text-slate-400 text-sm" id="subtitleText">Select a surah to begin</p>
                </div>
            </div>

            <!-- Tab Bar -->
            <div class="tab-bar">
                <button class="tab-btn active" data-view="surahsView" onclick="showView('surahsView')">Surahs</button>
                <button class="tab-btn" data-view="readerView" onclick="showView('readerView')">Reader</button>
                <button class="tab-btn" data-view="progressView" onclick="showView('progressView')">My Progress</button>
            </div>

            <!-- SURAHS VIEW -->
            <div id="surahsView">
                <div class="flex gap-3 mb-4">
                    <div class="flex-1">
                        <input type="text" id="surahSearch" class="input-field" placeholder="Search surah name or number..." oninput="filterSurahs()">
                    </div>
                </div>
                <div id="surahList" class="grid gap-3 surahs-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));"></div>
            </div>

            <!-- READER VIEW -->
            <div id="readerView" class="hidden-section">
                <div class="flex items-center justify-between mb-4 flex-wrap gap-3">
                    <div class="flex items-center gap-3">
                        <button onclick="loadSurah(currentSurah - 1)" class="btn-secondary" style="padding:8px 12px;">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <div>
                            <h2 class="text-xl font-bold text-emerald-400" id="surahName">Al-Fatiha</h2>
                            <p class="text-xs text-slate-500" id="surahMeta">1 · 7 verses</p>
                        </div>
                        <button onclick="loadSurah(currentSurah + 1)" class="btn-secondary" style="padding:8px 12px;">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>
                    <div class="flex gap-2 flex-wrap">
                        <button onclick="toggleMemorizationMode()" class="btn-secondary" id="memModeBtn" style="padding:8px 14px;font-size:12px;">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            Quiz Mode
                        </button>
                        <button onclick="showBismillahOption()" class="btn-secondary" style="padding:8px 14px;font-size:12px;">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Bismillah
                        </button>
                    </div>
                </div>

                <!-- Progress bar for surah -->
                <div class="mb-4">
                    <div class="flex justify-between text-xs text-slate-500 mb-1">
                        <span>Memorization Progress</span>
                        <span id="surahProgressText">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-bar-fill" id="surahProgressBar" style="width:0%"></div>
                    </div>
                </div>

                <!-- Loading -->
                <div id="readerLoading" class="text-center py-8 hidden">
                    <div class="animate-spin w-8 h-8 border-2 border-emerald-400 border-t-transparent rounded-full mx-auto mb-3"></div>
                    <p class="text-slate-400 text-sm">Loading surah...</p>
                </div>

                <!-- Ayah display -->
                <div id="ayahContainer"></div>

                <!-- Navigation bottom -->
                <div class="flex justify-between items-center mt-6 pt-4 border-t border-white/5">
                    <button onclick="loadSurah(currentSurah - 1)" class="btn-secondary" style="padding:8px 14px;">
                        ← Previous
                    </button>
                    <button onclick="showView('surahsView')" class="text-xs text-slate-500 hover:text-emerald-400 transition">All Surahs</button>
                    <button onclick="loadSurah(currentSurah + 1)" class="btn-secondary" style="padding:8px 14px;">
                        Next →
                    </button>
                </div>
            </div>

            <!-- PROGRESS VIEW -->
            <div id="progressView" class="hidden-section">
                <h2 class="text-xl font-bold text-emerald-400 mb-4" style="font-family: 'Nunito', sans-serif;">My Memorization Progress</h2>
                <div class="grid grid-cols-3 gap-3 mb-6" style="display: grid;">
                    <div class="stat-card">
                        <div class="stat-value" id="totalMemorized">0</div>
                        <div class="stat-label">Verses Memorized</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="surahsStarted">0</div>
                        <div class="stat-label">Surahs Started</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="surahsCompleted">0</div>
                        <div class="stat-label">Surahs Completed</div>
                    </div>
                </div>
                <label class="label">Surah Progress</label>
                <div id="progressList"></div>
            </div>

            <!-- Notification -->
            <div id="notificationBar" class="notification-bar hidden mt-4">
                <p class="text-sm font-semibold" id="notificationText"></p>
            </div>
        </div>
    </div>

    <script>

            "Meccan","Medinan","Meccan","Medinan","Meccan","Meccan","Meccan","Meccan","Meccan","Meccan",
            "Meccan","Meccan","Medinan","Meccan","Meccan","Meccan","Meccan","Meccan","Meccan","Meccan",
            "Meccan","Meccan","Meccan","Meccan","Meccan","Meccan","Medinan","Medinan","Medinan","Meccan",
            "Meccan","Meccan","Meccan","Meccan","Medinan","Meccan","Medinan","Medinan","Medinan","Medinan",
            "Medinan","Medinan","Medinan","Medinan","Medinan","Medinan","Meccan","Meccan","Meccan","Meccan",
            "Meccan","Meccan","Meccan","Meccan","Meccan","Medinan","Meccan","Meccan","Meccan","Meccan",
            "Meccan","Meccan","Meccan","Meccan","Meccan","Meccan","Meccan","Meccan","Meccan","Meccan",
            "Meccan","Meccan","Meccan","Meccan","Meccan","Meccan","Meccan","Medinan","Meccan","Meccan",
            "Meccan","Meccan","Meccan","Meccan","Meccan","Meccan","Meccan","Meccan","Meccan","Medinan",
            "Meccan","Meccan","Meccan","Meccan"
        ];

        // ============================================================
        // AUTH
        // ============================================================
        function attemptLogin() {
            const u = document.getElementById('usernameInput').value;
            const p = document.getElementById('passwordInput').value;
            const err = document.getElementById('loginError');
            if (u === 'ahmad' && p === 'ahmadwin') {
                document.getElementById('loginView').classList.add('hidden-section');
                document.getElementById('appContainer').classList.remove('hidden-section');
                document.getElementById('appContainer').classList.add('fade-in');
                initApp();
            } else {
                err.classList.remove('hidden');
                err.textContent = 'Invalid credentials.';
                setTimeout(() => err.classList.add('hidden'), 2500);
            }
        }

        // ============================================================
        // STATE
        // ============================================================
        let currentSurah = 1;
        let memorized = {};
        let bookmarks = [];
        let quizMode = false;
        let currentAyahs = [];
        let showBismillah = true;

        function initApp() {
            loadState();
            renderSurahList();
            updateProgress();
        }

        function loadState() {
            try {
                const d = JSON.parse(localStorage.getItem('quran_memorizer'));
                if (d) {
                    memorized = d.memorized || {};
                    bookmarks = d.bookmarks || [];
                }
            } catch(e) {}
        }

        function saveState() {
            try {
                localStorage.setItem('quran_memorizer', JSON.stringify({ memorized, bookmarks }));
            } catch(e) {}
        }

        function showNotification(msg) {
            const bar = document.getElementById('notificationBar');
            const text = document.getElementById('notificationText');
            text.textContent = msg;
            bar.classList.remove('hidden');
            clearTimeout(bar._timeout);
            bar._timeout = setTimeout(() => bar.classList.add('hidden'), 3000);
        }

        // ============================================================
        // VIEWS
        // ============================================================
        const allViews = ['surahsView', 'readerView', 'progressView'];

        function showView(viewId) {
            allViews.forEach(v => {
                document.getElementById(v).classList.add('hidden-section');
            });
            document.getElementById(viewId).classList.remove('hidden-section');
            document.getElementById(viewId).classList.add('fade-in');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            const btn = document.querySelector(`[data-view="${viewId}"]`);
            if (btn) btn.classList.add('active');
            if (viewId === 'progressView') updateProgress();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================================
        // SURAH LIST
        // ============================================================
        function renderSurahList() {
            renderFilteredSurahs(SURAH_NAMES.map((_, i) => i));
        }

        function filterSurahs() {
            const q = document.getElementById('surahSearch').value.toLowerCase().trim();
            const indices = [];
            SURAH_NAMES.forEach((name, i) => {
                const num = (i + 1).toString();
                if (name.toLowerCase().includes(q) || SURAH_NAMES_AR[i].includes(q) || num === q) {
                    indices.push(i);
                }
            });
            renderFilteredSurahs(indices);
        }

        function renderFilteredSurahs(indices) {
            const container = document.getElementById('surahList');
            container.innerHTML = indices.map(i => {
                const surahNum = i + 1;
                const memCount = Object.keys(memorized).filter(k => k.startsWith(surahNum + ':')).length;
                const totalAyahs = SURAH_AYAH_COUNT[i];
                const pct = totalAyahs > 0 ? Math.round((memCount / totalAyahs) * 100) : 0;
                return `
                    <div class="surah-card" onclick="loadSurah(${surahNum})">
                        <div class="surah-number">${surahNum}</div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2">
                                <span class="font-semibold">${SURAH_NAMES[i]}</span>
                                <span class="surah-name-ar">${SURAH_NAMES_AR[i]}</span>
                            </div>
                            <div class="flex items-center gap-3 text-xs text-slate-500 mt-1">
                                <span>${totalAyahs} verses</span>
                                <span>${REVELATION_TYPES[i]}</span>
                            </div>
                            ${pct > 0 ? `
                            <div class="progress-bar mt-2">
                                <div class="progress-bar-fill" style="width:${pct}%"></div>
                            </div>
                            <div class="text-xs text-emerald-400 mt-1">${memCount}/${totalAyahs} memorized</div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ============================================================
        // QURAN API
        // ============================================================
        async function loadSurah(surahNum) {
            if (surahNum < 1 || surahNum > 114) return;
            currentSurah = surahNum;
            showView('readerView');
            document.getElementById('readerLoading').classList.remove('hidden');
            document.getElementById('ayahContainer').innerHTML = '';
            document.getElementById('surahName').textContent = `${surahNum}. ${SURAH_NAMES[surahNum - 1]}`;
            document.getElementById('surahMeta').textContent = `${SURAH_NAMES_AR[surahNum - 1]} · ${SURAH_AYAH_COUNT[surahNum - 1]} verses · ${REVELATION_TYPES[surahNum - 1]}`;
            document.getElementById('mainTitle').textContent = SURAH_NAMES[surahNum - 1];
            document.getElementById('subtitleText').textContent = `Surah ${SURAH_NAMES_AR[surahNum - 1]}`;

            try {
                const res = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/ar.alafasy`);
                const data = await res.json();
                currentAyahs = data.data.ayahs || [];
                renderAyahs(currentAyahs);
            } catch (e) {
                document.getElementById('ayahContainer').innerHTML = '<p class="text-red-400 text-center py-8">Failed to load. Check your connection.</p>';
            }
            document.getElementById('readerLoading').classList.add('hidden');
            updateSurahProgress();
        }

        // ============================================================
        // AYAH RENDERING
        // ============================================================
        function renderAyahs(ayahs) {
            const container = document.getElementById('ayahContainer');
            const surahNum = currentSurah;
            let html = '';

            if (showBismillah && surahNum !== 1 && surahNum !== 9) {
                html += `
                    <div class="text-center py-4 text-emerald-400 text-2xl" style="font-family:'Traditional Arabic','Scheherazade New','Amiri',serif;direction:rtl;">
                        ﷽
                    </div>
                `;
            }

            ayahs.forEach((ayah, idx) => {
                const key = surahNum + ':' + ayah.numberInSurah;
                const isMemorized = memorized[key];
                const isBookmarked = bookmarks.includes(key);
                const text = ayah.text;
                const ayahNum = ayah.numberInSurah;

                let ayahHtml = text;
                if (quizMode) {
                    const words = text.split(' ');
                    ayahHtml = words.map(w => {
                        const show = Math.random() > 0.4;
                        return show ? w : `<span class="ayah-word hidden" onclick="revealWord(this)">${w}</span>`;
                    }).join(' ');
                }

                html += `
                    <div class="ayah-block ${isMemorized ? 'memorized' : ''} ${isBookmarked ? 'bookmarked' : ''}" id="ayah-${ayahNum}">
                        <div class="flex-1">
                            <div class="ayah-text">${ayahHtml}
                                <span class="ayah-number">${ayahNum}</span>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1 flex-shrink-0">
                            <button onclick="toggleMemorized(${surahNum}, ${ayahNum})" class="text-xs p-1 rounded transition hover:bg-white/5 ${isMemorized ? 'text-emerald-400' : 'text-slate-600'}" title="Toggle memorized">
                                <svg class="w-4 h-4" fill="${isMemorized ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            </button>
                            <button onclick="toggleBookmark(${surahNum}, ${ayahNum})" class="text-xs p-1 rounded transition hover:bg-white/5 ${isBookmarked ? 'text-yellow-400' : 'text-slate-600'}" title="Bookmark">
                                <svg class="w-4 h-4" fill="${isBookmarked ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                            </button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            updateSurahProgress();
        }

        function revealWord(el) {
            el.classList.remove('hidden');
            el.style.color = '#10b981';
            setTimeout(() => { el.style.color = ''; }, 1000);
        }

        // ============================================================
        // MEMORIZATION
        // ============================================================
        function toggleMemorized(surahNum, ayahNum) {
            const key = surahNum + ':' + ayahNum;
            if (memorized[key]) {
                delete memorized[key];
            } else {
                memorized[key] = true;
            }
            saveState();
            renderAyahs(currentAyahs);
            renderSurahList();
            updateSurahProgress();
        }

        function toggleBookmark(surahNum, ayahNum) {
            const key = surahNum + ':' + ayahNum;
            const idx = bookmarks.indexOf(key);
            if (idx > -1) {
                bookmarks.splice(idx, 1);
            } else {
                bookmarks.push(key);
            }
            saveState();
            renderAyahs(currentAyahs);
        }

        function toggleMemorizationMode() {
            quizMode = !quizMode;
            const btn = document.getElementById('memModeBtn');
            if (quizMode) {
                btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            Quiz ON`;
                btn.style.borderColor = '#10b981';
                btn.style.color = '#10b981';
            } else {
                btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            Quiz Mode`;
                btn.style.borderColor = '';
                btn.style.color = '';
            }
            if (currentAyahs.length) renderAyahs(currentAyahs);
        }

        function showBismillahOption() {
            showBismillah = !showBismillah;
            if (currentAyahs.length) renderAyahs(currentAyahs);
            showNotification(showBismillah ? '﷽ visible' : '﷽ hidden');
        }

        function updateSurahProgress() {
            const surahNum = currentSurah;
            const total = SURAH_AYAH_COUNT[surahNum - 1];
            let done = 0;
            for (let i = 1; i <= total; i++) {
                if (memorized[surahNum + ':' + i]) done++;
            }
            const pct = total > 0 ? Math.round((done / total) * 100) : 0;
            document.getElementById('surahProgressText').textContent = `${done}/${total} (${pct}%)`;
            document.getElementById('surahProgressBar').style.width = pct + '%';
        }

        // ============================================================
        // PROGRESS VIEW
        // ============================================================
        function updateProgress() {
            let totalMem = 0;
            let surahsStarted = new Set();
            let surahsCompleted = 0;

            Object.keys(memorized).forEach(key => {
                const parts = key.split(':');
                const s = parseInt(parts[0]);
                const a = parseInt(parts[1]);
                totalMem++;
                surahsStarted.add(s);
            });

            surahsStarted.forEach(s => {
                const total = SURAH_AYAH_COUNT[s - 1];
                let done = 0;
                for (let i = 1; i <= total; i++) {
                    if (memorized[s + ':' + i]) done++;
                }
                if (done >= total) surahsCompleted++;
            });

            document.getElementById('totalMemorized').textContent = totalMem;
            document.getElementById('surahsStarted').textContent = surahsStarted.size;
            document.getElementById('surahsCompleted').textContent = surahsCompleted;

            const list = document.getElementById('progressList');
            if (surahsStarted.size === 0) {
                list.innerHTML = '<p class="text-slate-500 text-sm text-center py-4">No surahs started yet. Pick one to memorize!</p>';
                return;
            }
            const sorted = Array.from(surahsStarted).sort((a, b) => a - b);
            list.innerHTML = sorted.map(s => {
                const total = SURAH_AYAH_COUNT[s - 1];
                let done = 0;
                for (let i = 1; i <= total; i++) {
                    if (memorized[s + ':' + i]) done++;
                }
                const pct = Math.round((done / total) * 100);
                return `
                    <div class="flex items-center gap-3 py-3 border-b border-white/5 cursor-pointer hover:bg-white/5 px-2 rounded transition" onclick="loadSurah(${s})">
                        <div class="surah-number" style="width:32px;height:32px;font-size:12px;">${s}</div>
                        <div class="flex-1 min-w-0">
                            <div class="font-medium text-sm">${SURAH_NAMES[s - 1]} <span class="text-xs text-slate-500">${SURAH_NAMES_AR[s - 1]}</span></div>
                            <div class="progress-bar mt-1">
                                <div class="progress-bar-fill" style="width:${pct}%"></div>
                            </div>
                        </div>
                        <div class="text-xs text-emerald-400 font-semibold">${done}/${total}</div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
